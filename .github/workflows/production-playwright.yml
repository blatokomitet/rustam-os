name: Production Cloudflare Playwright
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-playwright.yml'
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install && npm install --no-save @playwright/test@1.56.1
      - name: Browser test published Cloudflare
        run: npx playwright test tests/live.spec.cjs --reporter=list
        env:
          RUSTAM_OS_URL: https://rustam-os.rustam-zhabrailov.workers.dev/
          CI: 'true'
          HOME: /root
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-playwright-debug
          path: |
            test-results/
            playwright-report/
          retention-days: 7
